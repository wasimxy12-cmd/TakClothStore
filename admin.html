<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Tak Cloth Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        body { background: #f4f6f8; padding: 24px; color: #111827; }
        .container { max-width: 1100px; margin: 0 auto; }
        .panel { background: white; border-radius: 16px; box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08); padding: 28px; }
        h1 { margin-bottom: 18px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
        .toolbar button, .toolbar a { padding: 12px 18px; border: none; border-radius: 10px; cursor: pointer; text-decoration: none; font-weight: 600; }
        .toolbar button { background: #111827; color: white; }
        .toolbar a { background: #e5e7eb; color: #111827; }
        .message { margin-bottom: 18px; min-height: 24px; color: #111827; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 14px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
        th { background: #f8fafc; font-weight: 700; text-align: left; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; }
        button.removeBtn { width: 100%; background: #ef4444; color: white; }
        @media (max-width: 900px) { .toolbar { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <h1>Admin Inventory</h1>
            <div class="toolbar">
                <button id="saveInventory" type="button">Save Inventory</button>
                <button id="addProduct" type="button">Add New Product</button>
                <button id="logoutButton" type="button" style="background:#f59e0b;">Logout</button>
                <a href="/index.html">View Storefront</a>
            </div>
            <div class="message" id="adminMessage">Loading...</div>
            <div style="overflow-x:auto;">
                <table id="inventoryTable">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Price</th>
                            <th>Category</th>
                            <th>Brand</th>
                            <th>Fabric Type</th>
                            <th>Print Type</th>
                            <th>Badge</th>
                            <th>Images</th>
                            <th>Remove</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="/admin.js"></script>
</body>
</html>
