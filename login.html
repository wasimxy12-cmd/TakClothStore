<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Tak Cloth Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #f4f4f6, #e8e4dc);
            color: #1c1c1c;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h1 { font-size: 1.4rem; margin-bottom: 8px; }
        p { color: #666; font-size: 0.95rem; margin-bottom: 24px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        button {
            width: 100%;
            margin-top: 12px;
            border: none;
            padding: 12px;
            border-radius: 6px;
            background: #1c1c1c;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #D4AF37; color: black; }
        .message { margin-top: 14px; font-size: 0.9rem; min-height: 20px; color: #c0392b; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Admin Login</h1>
        <p>Sign in to manage inventory and upload products.</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div class="message" id="loginMessage"></div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginMessage = document.getElementById('loginMessage');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('username')) {
            usernameInput.value = urlParams.get('username');
        }
        if (urlParams.has('password')) {
            passwordInput.value = urlParams.get('password');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginMessage.textContent = '';

            const payload = {
                username: usernameInput.value,
                password: passwordInput.value
            };

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    credentials: 'include'
                });

                const text = await res.text();
                let data;
                try {
                    data = text ? JSON.parse(text) : {};
                } catch (parseErr) {
                    throw new Error(`Unexpected response: ${text}`);
                }

                if (!res.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                window.location.href = '/admin.html';
            } catch (err) {
                loginMessage.textContent = err.message;
            }
        });
    </script>
</body>
</html>
