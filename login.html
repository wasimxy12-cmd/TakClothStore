<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Tak Cloth Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #f4f4f6, #e8e4dc);
            color: #1c1c1c;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h1 { font-size: 1.6rem; margin-bottom: 16px; }
        label { display: block; margin-bottom: 12px; font-size: 0.95rem; color: #333; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 10px; margin-top: 6px; font-size: 1rem; }
        button { width: 100%; padding: 14px 16px; border: none; border-radius: 10px; background: #1c1c1c; color: white; font-size: 1rem; cursor: pointer; margin-top: 18px; }
        .message { margin-top: 16px; color: #b91c1c; min-height: 22px; }
        .link-row { margin-top: 18px; text-align: center; }
        .link-row a { color: #1c1c1c; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Admin Login</h1>
        <p>Sign in to manage inventory through the Vercel/Subspace backend.</p>
        <form id="loginForm">
            <label>
                Username
                <input type="text" name="username" autocomplete="username" required>
            </label>
            <label>
                Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Sign In</button>
        </form>
        <div class="message" id="loginMessage"></div>
        <div class="link-row"><a href="/index.html">Return to store</a></div>
    </div>
    <script src="/login.js"></script>
</body>
</html>
